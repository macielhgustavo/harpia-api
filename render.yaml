services:
  - type: web
    name: harpia-api
    env: node
    buildCommand: npm install && npx prisma migrate deploy && npx prisma generate && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: NODE_ENV
        value: production
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: 'false'
      - key: SIGNED_URL_EXPIRATION_SECONDS
        value: '300'
      - key: COLLECTION_AUTOMATION_ENABLED
        value: 'true'
      - key: COLLECTION_FROM_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
